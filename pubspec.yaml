name: math_facts_ai
description: "Math Facts AI - AI-powered mathematics learning application for KG to Grade 3 children"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local SQLite Database
  drift: ^2.16.0
  drift_flutter: ^0.1.1
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0

  # UI, Fonts & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Audio & Text to Speech
  flutter_tts: ^4.0.2

  # Networking & AI
  http: ^1.2.1

  # Utilities
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/
