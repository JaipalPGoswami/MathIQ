name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android project
        run: |
          rm -rf android/
          flutter create --project-name math_facts_ai --platforms=android --org com.mathfacts .
          ls -la android/

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: |
          flutter build apk --debug 2>&1 | tee build.log || true
          APKS=$(find build -name "*.apk" 2>/dev/null || true)
          if [ -z "$APKS" ]; then
            echo "::error::APK build failed!"
            tail -n 80 build.log
            exit 1
          fi
          echo "APK files found:"
          find build -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathFactsAI-debug-apk
          path: build/**/*.apk
          retention-days: 14