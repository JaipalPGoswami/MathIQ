name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android platform files
        run: |
          flutter create --platforms=android --org com.mathfacts .
          rm -f android/build.gradle.kts android/settings.gradle.kts android/app/build.gradle.kts
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: List Generated APK Files
        run: find build -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathFactsAI-debug-apk
          path: build/**/*.apk
          retention-days: 14
